#cloud-config
# Target: Oracle Linux 9 (UEK7)
# Stack: Traefik, Authelia, Cockpit, WireGuard (wg-easy), Podman Quadlet,
#        PCP, optional Grafana/Valkey monitoring, and alert delivery
#
# ==============================================================
# TEMPLATE FILE — DO NOT USE DIRECTLY AS INSTANCE USER DATA
# ==============================================================
#
# This file contains template variables in ${VARIABLE} syntax.
# Process it with envsubst before deployment:
#
#   1. Copy .env.example to .env
#   2. Fill in all values in .env
#   3. Run:
#        export $(cat .env | xargs)
#        tools/render-config.sh \
#          | envsubst '${DOMAIN} ${ACME_EMAIL} ${ADMIN_EMAIL} ${CF_SECRET_OCID} ${AUTH_SECRET_OCID} ${WG_SECRET_OCID} ${GRAFANA_SECRET_OCID} ${MONITORING_PROFILE} ${ALERT_WEBHOOK_SECRET_OCID} ${ALERT_HEARTBEAT_SECRET_OCID}' \
#          > cloud-config.yaml
#   4. Use cloud-config.yaml as instance user data
#   5. Do not commit .env or cloud-config.yaml to version control
#
# See docs/guides/getting-started.md for full deployment instructions.
#
# ==============================================================
# PREREQUISITES (must exist before launching the instance):
# ==============================================================
#
#   OCI Infrastructure:
#   - VCN with Security List/NSG open on TCP 80, 443 and UDP 51820
#   - Block volume attached to the instance (paravirtualized).
#     Default device path: /dev/oracleoci/oraclevdb. The script also
#     probes /dev/sdb and /dev/vdb — no manual change needed if the
#     volume appears under a different path.
#   - Instance Principal IAM policy granting read on secret-family
#     in the Vault compartment
#
#   OCI Vault (five mandatory secrets, one optional):
#   - Secret name: traefik-cloudflare-token  → Cloudflare DNS API token
#   - Secret name: authelia-admin-password   → Authelia admin password
#   - Secret name: wg-easy-admin-password    → wg-easy admin password
#   - Secret name: grafana-admin-password    → Grafana admin password
#     Required when MONITORING_PROFILE is live or history.
#   - Secret name: alert-webhook-url          → HTTPS alert webhook
#   - Secret name: alert-heartbeat-url        → External heartbeat URL
#   See docs/guides/getting-started.md section 4 for setup steps.
#
#   Monitoring profiles:
#   - live:    4 GB RAM, 2 vCPU, 2 GB free disk (default)
#   - history: 6 GB RAM, 2 vCPU, 5 GB free disk (adds Valkey)
#   - none:    PCP only
#   See docs/reference/infrastructure.md section 8.
#
#   Cloudflare DNS (all records must exist before first boot):
#   - auth.${DOMAIN}     A  <instance public IP>  DNS Only
#   - cockpit.${DOMAIN}  A  <instance public IP>  DNS Only
#   - wg.${DOMAIN}       A  <instance public IP>  DNS Only
#   Admin subdomains must be DNS Only (grey cloud), not proxied.
#   Grafana, Valkey, pmproxy, and raw metrics have no DNS records.
#   See docs/guides/getting-started.md section 5 for full DNS setup.
#
# NOTE: 10.0.0.x in the wg-easy config is correct wg-easy syntax,
#       not a template placeholder.
#
# ==============================================================

# ======================= USERS & GROUPS =======================
groups:
  - traefik
  - alerting

users:
  - name: traefik
    groups: traefik
    system: true
    shell: /usr/sbin/nologin
    lock_passwd: true
  - name: authelia
    system: true
    shell: /usr/sbin/nologin
    homedir: /home/authelia
    lock_passwd: true
  - name: alerting
    system: true
    shell: /usr/sbin/nologin
    homedir: /var/lib/stack-alerting
    lock_passwd: true

# ======================= PACKAGES =============================
package_update: true
package_upgrade: true

packages:
  - wireguard-tools # Host-based VPN tooling
  - cockpit # Web console
  - cockpit-storaged
  - cockpit-podman
  - cockpit-pcp # Cockpit PCP metrics page
  - pcp # Performance Co-Pilot
  - pcp-zeroconf # pmlogger and default archive setup
  - pcp-pmda-podman # Rootful container metrics
  - pcp-pmda-openmetrics # Traefik and application metrics
  - audit # Kernel audit daemon
  - policycoreutils-python-utils
  - iptables-nft # iptables compatibility on nftables (OL9)
  - curl
  - jq
  - git
  - tar
  - gzip
  # Note: container-tools is a DNF module on OL9, enabled via runcmd

# ======================= FILE SYSTEM ==========================
write_files:
  # BEGIN GENERATED CONFIG FILES
  # END GENERATED CONFIG FILES

# ======================= RUN COMMANDS =========================
runcmd:
  # -----------------------------------------------------------
  # Boot Volume Expansion
  # OCI instances are provisioned with a base image that may not
  # use all available boot volume space. oci-growfs expands the
  # root filesystem to the full boot volume size.
  # oci-utils is typically pre-installed on OCI Oracle Linux images
  # but installed here if missing to ensure idempotency.
  # -----------------------------------------------------------
  - |
    dnf install -y oci-utils || true
    oci-growfs -y || true

  # -----------------------------------------------------------
  # Block Storage Setup
  # Idempotent: formats only if no filesystem found.
  # Mounted at /data — the persistent layer for this entire stack.
  #
  # Device path: /dev/oracleoci/oraclevdb is the default for OCI
  # paravirtualized volumes, but the path can vary by attachment
  # or instance shape. The script probes all known paths in order
  # and uses the first one found. Mounted by UUID in fstab so the
  # mount remains stable even if the device path changes on reboot.
  # -----------------------------------------------------------
  - |
    BLOCK_DEV=""
    for dev in /dev/oracleoci/oraclevdb /dev/sdb /dev/vdb; do
      [ -b "$dev" ] && BLOCK_DEV="$dev" && break
    done

    if [ -n "$BLOCK_DEV" ]; then
      if ! blkid "$BLOCK_DEV" | grep -q TYPE; then
        mkfs.xfs "$BLOCK_DEV"
        echo "Formatted $BLOCK_DEV as XFS"
      fi
      mkdir -p /data
      UUID=$(blkid -s UUID -o value "$BLOCK_DEV")
      if ! grep -q "UUID=$UUID" /etc/fstab; then
        echo "UUID=$UUID /data xfs defaults,noatime 0 2" >> /etc/fstab
      fi
      mount /data || true
    else
      echo "WARNING: No block device found — persistent storage unavailable"
    fi

  # -----------------------------------------------------------
  # Persistent Directory Structure on Block Volume
  #
  # Traefik, Authelia, and WireGuard configuration files
  # Quadlet unit files for Podman app containers
  # -----------------------------------------------------------
  - |
    mkdir -p \
      /data/traefik/letsencrypt \
      /data/authelia/config \
      /data/authelia/db \
      /data/logs/traefik \
      /data/logs/authelia \
      /data/containers/wg-easy \
      /data/monitoring/grafana \
      /data/monitoring/valkey \
      /data/monitoring/alerting \
      /data/apps \
      /etc/containers/systemd   # Quadlet unit files for app containers

  # -----------------------------------------------------------
  # Symlinks: OS Paths → Persistent Storage
  # Ensures all services write to the block volume transparently
  # -----------------------------------------------------------
  - |
    rm -rf /etc/traefik/letsencrypt
    ln -sfn /data/traefik/letsencrypt /etc/traefik/letsencrypt

    rm -rf /var/log/traefik
    ln -sfn /data/logs/traefik /var/log/traefik

  # -----------------------------------------------------------
  # Traefik Configuration Directories & Ownership
  # -----------------------------------------------------------
  - |
    mkdir -p /etc/traefik/config
    chown -R traefik:traefik /etc/traefik
    chown -R traefik:traefik /data/traefik /data/logs/traefik
    chmod 700 /data/traefik/letsencrypt

  # -----------------------------------------------------------
  # Container Tools, Subordinate IDs, and Image Pull
  # Images pulled here so Authelia bootstrap (below) can use them.
  #
  # Podman and buildah are required, skopeo for image inspection.
  # fuse-overlayfs and slirp4netns support rootless Authelia.
  # podman-compose is intentionally omitted; Quadlet is used instead.
  #
  # The Authelia and wg-easy subordinate ranges are disjoint so the
  # rootless user cannot reach wg-easy volume data through its own
  # user namespace.
  # -----------------------------------------------------------
  - |
    set -e
    dnf module enable -y container-tools:ol9 || dnf module enable -y container-tools
    dnf install -y podman buildah skopeo fuse-overlayfs slirp4netns

    podman pull ghcr.io/wg-easy/wg-easy:15

    AUTHELIA_UID=$(id -u authelia)
    install -d -m 0700 -o authelia -g authelia /home/authelia
    CURRENT_SUBUID=$(awk -F: '$1 == "authelia" { printf "%s-%s", $2, $2 + $3 - 1; exit }' /etc/subuid)
    if [ -n "$CURRENT_SUBUID" ] && [ "$CURRENT_SUBUID" != "400000-465535" ]; then
      usermod --del-subuids "$CURRENT_SUBUID" authelia
    fi
    if ! grep -q '^authelia:400000:65536$' /etc/subuid; then
      usermod --add-subuids 400000-465535 authelia
    fi

    CURRENT_SUBGID=$(awk -F: '$1 == "authelia" { printf "%s-%s", $2, $2 + $3 - 1; exit }' /etc/subgid)
    if [ -n "$CURRENT_SUBGID" ] && [ "$CURRENT_SUBGID" != "400000-465535" ]; then
      usermod --del-subgids "$CURRENT_SUBGID" authelia
    fi
    if ! grep -q '^authelia:400000:65536$' /etc/subgid; then
      usermod --add-subgids 400000-465535 authelia
    fi

    loginctl enable-linger authelia
    systemctl start "user@${AUTHELIA_UID}.service"
    for _ in $(seq 1 60); do
      [ -d "/run/user/${AUTHELIA_UID}" ] && break
      sleep 1
    done
    if [ ! -d "/run/user/${AUTHELIA_UID}" ]; then
      echo "ERROR: user manager runtime directory for authelia did not appear" >&2
      exit 1
    fi

    runuser -u authelia -- env XDG_RUNTIME_DIR="/run/user/${AUTHELIA_UID}" \
      podman pull authelia/authelia:4.39

  # -----------------------------------------------------------
  # Fetch Secrets from OCI Vault (Instance Principal auth)
  # -----------------------------------------------------------
  - |
    dnf install -y oci-cli

    CF_TOKEN=$(oci secrets secret-bundle get \
      --secret-id ${CF_SECRET_OCID} \
      --query "data.secretBundleContent.content" \
      --raw-output | base64 -d)

    AUTHELIA_ADMIN_PASS=$(oci secrets secret-bundle get \
      --secret-id ${AUTH_SECRET_OCID} \
      --query "data.secretBundleContent.content" \
      --raw-output | base64 -d)

    WG_ADMIN_PASS=$(oci secrets secret-bundle get \
      --secret-id ${WG_SECRET_OCID} \
      --query "data.secretBundleContent.content" \
      --raw-output | base64 -d)

    if [ "${MONITORING_PROFILE}" != "none" ]; then
      if [ -z "${GRAFANA_SECRET_OCID}" ]; then
        echo "ERROR: GRAFANA_SECRET_OCID is required for the ${MONITORING_PROFILE} profile" >&2
        exit 1
      fi
      GRAFANA_ADMIN_PASS=$(oci secrets secret-bundle get \
        --secret-id "${GRAFANA_SECRET_OCID}" \
        --query "data.secretBundleContent.content" \
        --raw-output | base64 -d)
      printf 'GF_SECURITY_ADMIN_PASSWORD=%s\n' "$GRAFANA_ADMIN_PASS" \
        > /run/grafana-bootstrap.tmp
      chmod 600 /run/grafana-bootstrap.tmp
    fi

    if [ -z "${ALERT_WEBHOOK_SECRET_OCID}" ] || [ -z "${ALERT_HEARTBEAT_SECRET_OCID}" ]; then
      echo "ERROR: ALERT_WEBHOOK_SECRET_OCID and ALERT_HEARTBEAT_SECRET_OCID are required" >&2
      exit 1
    fi

    ALERT_WEBHOOK_URL=$(oci secrets secret-bundle get \
      --secret-id "${ALERT_WEBHOOK_SECRET_OCID}" \
      --query "data.secretBundleContent.content" \
      --raw-output | base64 -d)
    ALERT_HEARTBEAT_URL=$(oci secrets secret-bundle get \
      --secret-id "${ALERT_HEARTBEAT_SECRET_OCID}" \
      --query "data.secretBundleContent.content" \
      --raw-output | base64 -d)

    case "${ALERT_WEBHOOK_URL}" in
      https://*) ;;
      *)
        echo "ERROR: alert-webhook-url must use HTTPS" >&2
        exit 1
        ;;
    esac

    case "${ALERT_HEARTBEAT_URL}" in
      https://*) ;;
      *)
        echo "ERROR: alert-heartbeat-url must use HTTPS" >&2
        exit 1
        ;;
    esac

    install -d -m 0750 -o alerting -g alerting /data/monitoring/alerting
    umask 077
    {
      printf 'ALERT_WEBHOOK_URL=%q\n' "${ALERT_WEBHOOK_URL}"
      printf 'ALERT_HEARTBEAT_URL=%q\n' "${ALERT_HEARTBEAT_URL}"
    } > /data/monitoring/alerting/env
    chown alerting:alerting /data/monitoring/alerting/env
    chmod 0600 /data/monitoring/alerting/env

    echo "CF_DNS_API_TOKEN=$CF_TOKEN" > /etc/traefik/env
    chown traefik:traefik /etc/traefik/env
    chmod 600 /etc/traefik/env

    # Write passwords to ephemeral tmpfs for use in bootstrap blocks below.
    # /run is in-memory only — never touches disk or block volume.
    echo "$AUTHELIA_ADMIN_PASS" > /run/authelia-bootstrap.tmp
    chmod 600 /run/authelia-bootstrap.tmp
    echo "$WG_ADMIN_PASS" > /run/wg-bootstrap.tmp
    chmod 600 /run/wg-bootstrap.tmp

  # -----------------------------------------------------------
  # PCP Export and Optional Monitoring UI
  # pmproxy is the only Prometheus-compatible endpoint.
  # Grafana and Valkey are loopback-only and have no Traefik route.
  # -----------------------------------------------------------
  - |
    set -e

    systemctl enable --now pmcd.service pmlogger.service pmproxy.service podman.socket

    (cd /var/lib/pcp/pmdas/podman && ./Install)
    (cd /var/lib/pcp/pmdas/openmetrics && ./Install)
    systemd-tmpfiles --create /etc/tmpfiles.d/pcp-openmetrics.conf
    systemctl restart pmcd.service pmproxy.service
    systemctl enable --now pmie.service 2>/dev/null || true

    install -d -m 0750 -o alerting -g alerting /var/lib/stack-alerting
    systemd-tmpfiles --create /etc/tmpfiles.d/pcp-alerting.conf
    systemctl daemon-reload
    if ! runuser -u alerting -- pmie -C -c /etc/pcp/pmie/stack-alerts.pmie; then
      echo "ERROR: pmie rejected /etc/pcp/pmie/stack-alerts.pmie" >&2
      exit 1
    fi
    if ! systemctl enable --now \
      pcp-alert-pmie.service \
      pcp-service-check.timer \
      pcp-cert-check.timer \
      pcp-heartbeat.timer; then
      echo "WARNING: alerting services failed to start; run verify-stack.sh" >&2
    fi

    if [ "${MONITORING_PROFILE}" != "none" ]; then
      dnf install -y grafana grafana-pcp
      install -d -m 0750 -o grafana -g grafana /data/monitoring/grafana
      if [ ! -f /data/monitoring/grafana/env ]; then
        install -m 0600 -o grafana -g grafana \
          /run/grafana-bootstrap.tmp /data/monitoring/grafana/env
      fi
      rm -f /run/grafana-bootstrap.tmp
      systemctl daemon-reload
      systemctl enable --now grafana-server.service
    fi

    if [ "${MONITORING_PROFILE}" = "history" ]; then
      dnf install -y valkey
      install -d -m 0750 -o valkey -g valkey /data/monitoring/valkey
      systemctl enable --now valkey.service
      systemctl restart pmproxy.service
    fi

  # -----------------------------------------------------------
  # Authelia First-Run Bootstrap
  # All steps are idempotent — skipped on redeploy if data exists
  # -----------------------------------------------------------
  - |
    set -e
    AUTHELIA_UID=$(id -u authelia)
    AUTHELIA_GID=$(id -g authelia)

    # Generate and persist secrets on first run only
    if [ ! -f /data/authelia/env ]; then
      JWT_SECRET=$(openssl rand -hex 32)
      SESSION_SECRET=$(openssl rand -hex 32)
      STORAGE_ENCRYPTION_KEY=$(openssl rand -hex 32)
      {
        echo "AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET=${JWT_SECRET}"
        echo "AUTHELIA_SESSION_SECRET=${SESSION_SECRET}"
        echo "AUTHELIA_STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY}"
      } > /data/authelia/env
    fi
    if ! grep -q '^AUTHELIA_STORAGE_ENCRYPTION_KEY=' /data/authelia/env; then
      printf 'AUTHELIA_STORAGE_ENCRYPTION_KEY=%s\n' "$(openssl rand -hex 32)" >> /data/authelia/env
    fi
    if ! grep -q '^PUID=' /data/authelia/env; then
      printf 'PUID=%s\nPGID=%s\n' "$AUTHELIA_UID" "$AUTHELIA_GID" >> /data/authelia/env
    fi
    if ! grep -q '^UMASK=' /data/authelia/env; then
      echo 'UMASK=0077' >> /data/authelia/env
    fi
    chmod 600 /data/authelia/env

    # Copy configuration template on first run only
    if [ ! -f /data/authelia/config/configuration.yml ]; then
      cp /etc/authelia/configuration.yml /data/authelia/config/configuration.yml
      chmod 600 /data/authelia/config/configuration.yml
    fi

    # Bootstrap admin user if no users database exists
    if [ ! -f /data/authelia/config/users_database.yaml ]; then
      AUTHELIA_ADMIN_PASS=$(cat /run/authelia-bootstrap.tmp)
      PASS_HASH=$(runuser -u authelia -- env XDG_RUNTIME_DIR="/run/user/${AUTHELIA_UID}" \
        podman run --rm authelia/authelia:4.39 \
        authelia crypto hash generate argon2 --password "$AUTHELIA_ADMIN_PASS" \
        | grep 'Digest:' | awk '{print $2}')
      rm -f /run/authelia-bootstrap.tmp
      {
        echo "users:"
        echo "  admin:"
        echo "    displayname: \"Admin\""
        echo "    password: \"${PASS_HASH}\""
        echo "    email: ${ADMIN_EMAIL}"
        echo "    groups:"
        echo "      - admins"
      } > /data/authelia/config/users_database.yaml
      chmod 600 /data/authelia/config/users_database.yaml
    fi

    chown -R authelia:authelia /data/authelia
    chmod 700 /data/authelia /data/authelia/config /data/authelia/db

  # -----------------------------------------------------------
  # wg-easy Environment File (first run only)
  # Uses wg-easy v15 unattended setup env vars.
  # INIT_* variables are only processed on first container start.
  # INIT_IPV4_CIDR and INIT_IPV6_CIDR must be set together (v15 group 3 rule).
  # INIT_IPV6_CIDR uses a private ULA prefix for the WireGuard tunnel network —
  #   independent of whether the OCI VNIC has a public IPv6 address assigned.
  # INSECURE=true is required when running behind Traefik (TLS handled upstream).
  # Public IP fetched from OCI instance metadata.
  # -----------------------------------------------------------
  - |
    if [ ! -f /data/containers/wg-easy/env ]; then
      PUBLIC_IP=$(curl -s http://169.254.169.254/opc/v1/vnics/ \
        | python3 -c "import sys,json; print(json.load(sys.stdin)[0].get('publicIp',''))" 2>/dev/null)
      WG_ADMIN_PASS=$(cat /run/wg-bootstrap.tmp)
      {
        echo "PORT=51821"
        echo "INSECURE=true"
        echo "INIT_ENABLED=true"
        echo "INIT_USERNAME=admin"
        echo "INIT_PASSWORD=${WG_ADMIN_PASS}"
        echo "INIT_HOST=${PUBLIC_IP}"
        echo "INIT_PORT=51820"
        echo "INIT_DNS=1.1.1.1"
        echo "INIT_IPV4_CIDR=10.0.0.0/24"
        echo "INIT_IPV6_CIDR=fd00::/64"
        echo "INIT_ALLOWED_IPS=0.0.0.0/0,::/0"
      } > /data/containers/wg-easy/env
      chmod 600 /data/containers/wg-easy/env
    fi
    # The container root maps to host UID/GID 300000, so the volume must
    # be owned by that mapping.
    chown -R 300000:300000 /data/containers/wg-easy
    chmod 700 /data/containers/wg-easy
    # Always clean up — tmpfs file must not persist regardless of whether
    # the env file was newly created or already existed from a prior deploy
    rm -f /run/wg-bootstrap.tmp

  # -----------------------------------------------------------
  # SELinux File Contexts
  # Uses -m (modify) if context already exists, -a (add) if not
  # -----------------------------------------------------------
  - |
    semanage_fcontext() {
      semanage fcontext -m "$@" 2>/dev/null || semanage fcontext -a "$@"
    }
    semanage_fcontext -t bin_t "/usr/local/bin/traefik"
    semanage_fcontext -t bin_t "/usr/local/libexec/stack-alerting"
    semanage_fcontext -t etc_t "/etc/traefik(/.*)?"
    semanage_fcontext -t var_log_t "/data/logs/traefik(/.*)?"
    semanage_fcontext -t var_lib_t "/data/monitoring(/.*)?"
    semanage_fcontext -t container_file_t "/data/authelia(/.*)?"
    restorecon -Rv /usr/local/bin/ /usr/local/libexec/ /etc/traefik/ /data/logs/traefik/ /data/authelia/ /data/monitoring/
    semanage port -a -t http_port_t -p tcp 8082 2>/dev/null || \
    semanage port -m -t http_port_t -p tcp 8082

  # -----------------------------------------------------------
  # Quadlet Units
  # Authelia is a rootless user unit installed under the authelia
  # user's Quadlet directory. wg-easy is a rootful system unit in a
  # user namespace, written by write_files.
  # -----------------------------------------------------------
  - |
    set -e
    AUTHELIA_UID=$(id -u authelia)
    install -d -m 0755 "/etc/containers/systemd/users/${AUTHELIA_UID}"
    install -m 0644 /etc/authelia/authelia.container \
      "/etc/containers/systemd/users/${AUTHELIA_UID}/authelia.container"
    systemctl daemon-reload
    runuser -u authelia -- env XDG_RUNTIME_DIR="/run/user/${AUTHELIA_UID}" \
      systemctl --user daemon-reload
    runuser -u authelia -- env XDG_RUNTIME_DIR="/run/user/${AUTHELIA_UID}" \
      systemctl --user enable authelia.service
    runuser -u authelia -- env XDG_RUNTIME_DIR="/run/user/${AUTHELIA_UID}" \
      systemctl --user restart authelia.service

  # -----------------------------------------------------------
  # System Hardening
  # -----------------------------------------------------------
  - |
    setenforce 1
    sed -i 's/^SELINUX=.*/SELINUX=enforcing/' /etc/selinux/config
    systemctl enable --now auditd

  # -----------------------------------------------------------
  # Traefik Binary (architecture-aware)
  # -----------------------------------------------------------
  - |
    ARCH=$(uname -m)
    case "$ARCH" in
      x86_64)  TRAEFIK_ARCH="amd64" ;;
      aarch64) TRAEFIK_ARCH="arm64" ;;
      *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
    esac
    TRAEFIK_VERSION="v3.7.1"
    curl -fsSL "https://github.com/traefik/traefik/releases/download/${TRAEFIK_VERSION}/traefik_${TRAEFIK_VERSION}_linux_${TRAEFIK_ARCH}.tar.gz" \
      | tar -xz -C /usr/local/bin/ traefik
    chown root:root /usr/local/bin/traefik
    chmod 755 /usr/local/bin/traefik

  # -----------------------------------------------------------
  # IP Forwarding (required on host for wg-easy container)
  # -----------------------------------------------------------
  - echo "net.ipv4.ip_forward=1" > /etc/sysctl.d/99-wireguard.conf
  - sysctl -p /etc/sysctl.d/99-wireguard.conf

  # -----------------------------------------------------------
  # Persistent Journal Logging
  # -----------------------------------------------------------
  - |
    mkdir -p /var/log/journal
    systemd-tmpfiles --create --prefix /var/log/journal
    systemctl restart systemd-journald

  # -----------------------------------------------------------
  # Firewall Rules
  # Traefik metrics (8082), pmproxy (44322), Grafana (3000),
  # and Valkey (6379) are intentionally omitted. They are loopback-only.
  # -----------------------------------------------------------
  - |
    firewall-cmd --permanent --add-service={http,https}
    firewall-cmd --permanent --add-port=51820/udp
    firewall-cmd --reload

  # -----------------------------------------------------------
  # Start Services
  # -----------------------------------------------------------
  - systemctl daemon-reload
  - systemctl enable --now cockpit.socket traefik.service pmcd.service pmlogger.service pmproxy.service
  - systemctl enable --now pmie.service 2>/dev/null || true
  - systemctl enable --now pcp-alert-pmie.service pcp-service-check.timer pcp-cert-check.timer pcp-heartbeat.timer
  - systemctl restart cockpit.socket
  - systemctl enable wg-easy.service
  - |
    modprobe wireguard 2>/dev/null || true
    systemctl restart wg-easy.service
  - |
    if [ "${MONITORING_PROFILE}" != "none" ]; then
      systemctl enable --now grafana-server.service
    fi
    if [ "${MONITORING_PROFILE}" = "history" ]; then
      systemctl enable --now valkey.service
      systemctl restart pmproxy.service
    fi

  # -----------------------------------------------------------
  # Replay Application Deployment Manifests
  # Reconstructs Quadlet and Traefik configs for all apps registered
  # via deploy-service.sh and stored on the block volume.
  # Skipped silently on clean first boot (no manifests yet).
  # See docs/guides/adding-apps.md section 14.2 for details.
  # -----------------------------------------------------------
  - |
    if [ -d /data/apps ] && ls /data/apps/*.sh 2>/dev/null | grep -q .; then
      for manifest in /data/apps/*.sh; do
        echo "Replaying manifest: ${manifest}"
        bash "${manifest}" || echo "WARNING: manifest failed: ${manifest}"
      done
      systemctl daemon-reload
    fi

  # -----------------------------------------------------------
  # Final Message
  # -----------------------------------------------------------
  - |
    echo "Cloud-init execution complete. System is locked down and routing."
    echo "Stack: Traefik, Authelia, Cockpit, wg-easy, and PCP running."
    echo "Monitoring profile: ${MONITORING_PROFILE}"
