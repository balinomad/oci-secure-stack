# Grafana configuration for the OCI secure stack.
# The admin password is supplied at runtime through the environment file
# /data/monitoring/grafana/env. Do not add a password to this file.

[analytics]
check_for_updates = false
check_for_plugin_updates = false
reporting_enabled = false

[auth.anonymous]
enabled = false

[database]
type = sqlite3

[log]
mode = file
level = info

[paths]
data = /data/monitoring/grafana
logs = /var/log/grafana

[plugins]
# The grafana-pcp RPM does not ship Grafana plugin signatures.
allow_loading_unsigned_plugins = performancecopilot-pcp-app,performancecopilot-redis-datasource,performancecopilot-vector-datasource,performancecopilot-bpftrace-datasource,performancecopilot-flamegraph-panel,performancecopilot-breadcrumbs-panel,performancecopilot-troubleshooting-panel

[security]
admin_user = admin
cookie_secure = false
disable_gravatar = true

[server]
domain = localhost
enforce_domain = false
http_addr = 127.0.0.1
http_port = 3000
protocol = http
root_url = http://127.0.0.1:3000/
serve_from_sub_path = false

[users]
allow_sign_up = false
