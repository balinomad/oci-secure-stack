# Secret inventory for OCI Vault.
# Do not store secret values, secret OCIDs, or secret bundle contents here.
secrets:
  - name: traefik-cloudflare-token
    purpose: ACME DNS-01 challenge
    binding: CF_SECRET_OCID
    consumer: traefik
  - name: authelia-admin-password
    purpose: Initial Authelia admin password
    binding: AUTH_SECRET_OCID
    consumer: authelia
  - name: wg-easy-admin-password
    purpose: Initial wg-easy admin password
    binding: WG_SECRET_OCID
    consumer: wg-easy
