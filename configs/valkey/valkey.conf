# Valkey configuration for PCP pmseries history.
# Access is loopback-only. Do not add a public listener or a Traefik route.

bind 127.0.0.1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

daemonize no
supervised systemd
loglevel notice
logfile ""
databases 16
always-show-logo no

dir /data/monitoring/valkey
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec

maxmemory 512mb
maxmemory-policy noeviction
