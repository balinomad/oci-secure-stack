api:
  dashboard: true
  insecure: false

metrics:
  prometheus:
    entryPoint: metrics

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls:
        options: default
  metrics:
    address: "127.0.0.1:8082"   # Internal only , not exposed in firewall

providers:
  file:
    directory: /etc/traefik/config
    watch: true

certificatesResolvers:
  cloudflare:
    acme:
      email: "${ACME_EMAIL}"
      storage: "/etc/traefik/letsencrypt/acme.json"
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

accessLog:
  filePath: "/var/log/traefik/access.log"
  format: json
